<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER BREAKER - Number System Quiz</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            /* CYBER BREAKER UNIFIED PALETTE (Dark) */
            --aurora-teal: #00ffcc;
            --aurora-cyan: #00d4ff;
            --aurora-purple: #9d00ff;
            --primary: var(--aurora-teal);
            --secondary: var(--aurora-cyan);
            --bg: #011122;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --hover-bg: rgba(255, 255, 255, 0.1);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg: #e8f4f8;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text: #111111;
            --text-muted: #333333;
            --border: rgba(0, 0, 0, 0.1);
            --hover-bg: rgba(0, 0, 0, 0.05);
            --primary: #008080;
            --secondary: #005c99;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: var(--transition);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Moving Background */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 204, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(157, 0, 255, 0.1) 0%, transparent 40%);
        }

        .container {
            max-width: 850px;
            width: 100%;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            width: 100%;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .theme-toggle {
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.5rem;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: rotate(15deg) scale(1.1);
            border-color: var(--primary);
        }

        .quiz-card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 3.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--border);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--aurora-teal), var(--aurora-cyan));
            width: 0%;
            transition: width 0.4s ease;
        }

        .q-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
        }

        #timer {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 6px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        #timer.warning {
            animation: pulse 1s infinite;
            background: rgba(239, 68, 68, 0.2);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            line-height: 1.4;
            color: var(--text);
        }

        .options-grid {
            display: grid;
            gap: 1.2rem;
        }

        .option {
            padding: 1.4rem 1.8rem;
            border: 2px solid var(--border);
            border-radius: 15px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.02);
            width: 100%;
            text-align: left;
            color: var(--text);
            font-size: 1.1rem;
        }

        .option:hover {
            border-color: var(--primary);
            background: var(--hover-bg);
            transform: translateX(8px);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .option.correct {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .option.wrong {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.2);
        }

        .option i {
            display: none;
            font-size: 1.2rem;
        }

        .correct i.fa-check,
        .wrong i.fa-xmark {
            display: block;
        }

        /* Result View */
        .result-view {
            text-align: center;
            display: none;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-view i.trophy-icon {
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: block;
            filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.3));
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 10px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2.5rem auto;
            font-size: 3rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
            margin-top: 3rem;
        }

        .btn-quiz {
            padding: 1.2rem 3.5rem;
            background: linear-gradient(135deg, var(--aurora-teal), var(--aurora-cyan));
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.2);
            transition: var(--transition);
            width: fit-content;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-quiz:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 255, 204, 0.4);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            text-shadow: none;
        }

        .btn-secondary:hover {
            background: var(--hover-bg);
            border-color: var(--primary);
        }

        .footer-nav {
            margin-top: 3rem;
            text-align: center;
        }

        .footer-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .footer-nav a:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }

        @media (max-width: 600px) {
            .quiz-card {
                padding: 2.5rem 1.5rem;
                border-radius: 20px;
            }

            .question-text {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body data-theme="dark">

    <div class="bg-glow"></div>

    <div class="container">
        <header>
            <div class="logo">
                <img src="logo.jpeg" alt="Logo" style="width: 45px; height: 45px; border-radius: 50%; vertical-align: middle; margin-right: 12px; border: 2px solid var(--primary);">
                CYBER BREAKER
            </div>
            <button class="theme-toggle" id="themeBtn">
                <i class="fas fa-sun"></i>
            </button>
        </header>

        <main class="quiz-card">

            <!-- Quiz Screen -->
            <div id="quizScreen">
                <div class="q-info">
                    <span id="questionCount">Question 1 of 40</span>

                    <p style="color: #ff4444; font-weight: 800; font-size: 1.3rem; margin-bottom: 0.5rem; font-family: 'Orbitron';">Low Conversion Rate!</p>
                    <p style="color: var(--text-muted); font-size: 1rem;">You need at least 70% (35/50) to master the Number System. Study the guide and try again.</p>

                    <a href="number system.html" class="btn-quiz btn-secondary">Review Guide</a>

        </main>

        <div class="footer-nav">
            <a href="lessons.html"><i class="fas fa-arrow-left"></i> Hub</a>

    <script>
        const questions = [
            { q: "What is the base of the decimal number system?", a: [{ t: "2", c: false }, { t: "8", c: false }, { t: "10", c: true }, { t: "16", c: false }] },
            { q: "Which number system uses only 0 and 1?", a: [{ t: "Decimal", c: false }, { t: "Binary", c: true }, { t: "Octal", c: false }, { t: "Hexadecimal", c: false }] },
            { q: "What is the base of the binary system?", a: [{ t: "2", c: true }, { t: "8", c: false }, { t: "10", c: false }, { t: "16", c: false }] },
            { q: "Which system uses digits from 0 to 7?", a: [{ t: "Binary", c: false }, { t: "Decimal", c: false }, { t: "Octal", c: true }, { t: "Hexadecimal", c: false }] },
            { q: "What is the base of hexadecimal?", a: [{ t: "2", c: false }, { t: "8", c: false }, { t: "10", c: false }, { t: "16", c: true }] },
            { q: "What does “radix” mean?", a: [{ t: "Digit", c: false }, { t: "Base", c: true }, { t: "Value", c: false }, { t: "Symbol", c: false }] },
            { q: "What is MSB?", a: [{ t: "Minimum Bit", c: false }, { t: "Most Significant Bit", c: true }, { t: "Major Binary", c: false }, { t: "Main Bit", c: false }] },
            { q: "What is LSB?", a: [{ t: "Least Significant Bit", c: true }, { t: "Last System Bit", c: false }, { t: "Low Symbol Bit", c: false }, { t: "Logical System Bit", c: false }] },
            { q: "What is the largest digit in decimal?", a: [{ t: "8", c: false }, { t: "9", c: true }, { t: "10", c: false }, { t: "7", c: false }] },
            { q: "How many symbols are in hexadecimal?", a: [{ t: "10", c: false }, { t: "8", c: false }, { t: "16", c: true }, { t: "2", c: false }] },
            { q: "(1010)₂ in decimal is:", a: [{ t: "8", c: false }, { t: "10", c: true }, { t: "12", c: false }, { t: "14", c: false }] },
            { q: "(1111)₂ in decimal is:", a: [{ t: "14", c: false }, { t: "13", c: false }, { t: "15", c: true }, { t: "16", c: false }] },
            { q: "(10)₁₀ in binary is:", a: [{ t: "1000", c: false }, { t: "1010", c: true }, { t: "1100", c: false }, { t: "1110", c: false }] },
            { q: "(8)₁₀ in binary is:", a: [{ t: "1000", c: true }, { t: "1010", c: false }, { t: "1100", c: false }, { t: "1111", c: false }] },
            { q: "(17)₈ in decimal is:", a: [{ t: "14", c: false }, { t: "15", c: true }, { t: "16", c: false }, { t: "17", c: false }] },
            { q: "(2F)₁₆ in decimal is:", a: [{ t: "45", c: false }, { t: "46", c: false }, { t: "47", c: true }, { t: "48", c: false }] },
            { q: "(25)₁₀ in binary is:", a: [{ t: "11001", c: true }, { t: "10101", c: false }, { t: "11100", c: false }, { t: "10011", c: false }] },
            { q: "(64)₁₀ in binary is:", a: [{ t: "100000", c: false }, { t: "1000000", c: true }, { t: "1100000", c: false }, { t: "1110000", c: false }] },
            { q: "(1011)₂ in decimal is:", a: [{ t: "10", c: false }, { t: "11", c: true }, { t: "12", c: false }, { t: "13", c: false }] },
            { q: "(1110)₂ in decimal is:", a: [{ t: "12", c: false }, { t: "13", c: false }, { t: "14", c: true }, { t: "15", c: false }] },
            { q: "(1001)₂ in decimal is:", a: [{ t: "7", c: false }, { t: "8", c: false }, { t: "9", c: true }, { t: "10", c: false }] },
            { q: "(15)₁₀ in binary is:", a: [{ t: "1110", c: false }, { t: "1111", c: true }, { t: "1011", c: false }, { t: "1101", c: false }] },
            { q: "(20)₁₀ in octal is:", a: [{ t: "22", c: false }, { t: "23", c: false }, { t: "24", c: true }, { t: "25", c: false }] },
            { q: "(255)₁₀ in hexadecimal is:", a: [{ t: "EE", c: false }, { t: "FF", c: true }, { t: "AA", c: false }, { t: "DD", c: false }] },
            { q: "(A)₁₆ in decimal is:", a: [{ t: "8", c: false }, { t: "9", c: false }, { t: "10", c: true }, { t: "11", c: false }] },
            { q: "1 + 1 in binary =", a: [{ t: "1", c: false }, { t: "10", c: true }, { t: "11", c: false }, { t: "0", c: false }] },
            { q: "1 + 0 in binary =", a: [{ t: "0", c: false }, { t: "1", c: true }, { t: "10", c: false }, { t: "11", c: false }] },
            { q: "0 + 0 in binary =", a: [{ t: "0", c: true }, { t: "1", c: false }, { t: "10", c: false }, { t: "11", c: false }] },
            { q: "101 + 011 =", a: [{ t: "111", c: false }, { t: "1000", c: true }, { t: "1100", c: false }, { t: "1010", c: false }] },
            { q: "110 + 001 =", a: [{ t: "111", c: true }, { t: "110", c: false }, { t: "101", c: false }, { t: "100", c: false }] },
            { q: "111 + 001 =", a: [{ t: "1000", c: true }, { t: "111", c: false }, { t: "1010", c: false }, { t: "1100", c: false }] },
            { q: "10 + 10 =", a: [{ t: "10", c: false }, { t: "100", c: true }, { t: "110", c: false }, { t: "101", c: false }] },
            { q: "100 + 100 =", a: [{ t: "100", c: false }, { t: "1000", c: true }, { t: "1100", c: false }, { t: "1010", c: false }] },
            { q: "111 + 111 =", a: [{ t: "1110", c: true }, { t: "1111", c: false }, { t: "1101", c: false }, { t: "1000", c: false }] },
            { q: "1010 + 0101 =", a: [{ t: "1111", c: true }, { t: "1000", c: false }, { t: "1100", c: false }, { t: "1010", c: false }] },
            { q: "How many bits are in one byte?", a: [{ t: "4", c: false }, { t: "8", c: true }, { t: "16", c: false }, { t: "32", c: false }] },
            { q: "Which number system is used in computers?", a: [{ t: "Decimal", c: false }, { t: "Octal", c: false }, { t: "Binary", c: true }, { t: "Hexadecimal", c: false }] },
            { q: "Hexadecimal uses how many symbols?", a: [{ t: "10", c: false }, { t: "8", c: false }, { t: "16", c: true }, { t: "2", c: false }] },
            { q: "(FF)₁₆ in decimal is:", a: [{ t: "200", c: false }, { t: "255", c: true }, { t: "256", c: false }, { t: "254", c: false }] },
            { q: "Binary to hexadecimal grouping uses:", a: [{ t: "2 bits", c: false }, { t: "3 bits", c: false }, { t: "4 bits", c: true }, { t: "5 bits", c: false }] },
            { q: "How many bits are grouped to convert binary to octal?", a: [{ t: "2", c: false }, { t: "3", c: true }, { t: "4", c: false }, { t: "8", c: false }] },
            { q: "Convert (101)₂ to octal:", a: [{ t: "4", c: false }, { t: "5", c: true }, { t: "6", c: false }, { t: "7", c: false }] },
            { q: "Which letter represents 10 in hexadecimal?", a: [{ t: "A", c: true }, { t: "B", c: false }, { t: "C", c: false }, { t: "F", c: false }] },
            { q: "Which letter represents 15 in hexadecimal?", a: [{ t: "E", c: false }, { t: "F", c: true }, { t: "D", c: false }, { t: "A", c: false }] },
            { q: "Convert (12)₈ to binary:", a: [{ t: "001010", c: true }, { t: "001100", c: false }, { t: "101010", c: false }, { t: "011011", c: false }] },
            { q: "(C)₁₆ in decimal is:", a: [{ t: "11", c: false }, { t: "12", c: true }, { t: "13", c: false }, { t: "14", c: false }] },
            { q: "(7)₈ in binary is:", a: [{ t: "101", c: false }, { t: "110", c: false }, { t: "111", c: true }, { t: "100", c: false }] },
            { q: "(11)₁₀ to hexadecimal is:", a: [{ t: "A", c: false }, { t: "B", c: true }, { t: "C", c: false }, { t: "D", c: false }] },
            { q: "What is the largest value a 4-bit binary number can represent?", a: [{ t: "7", c: false }, { t: "8", c: false }, { t: "15", c: true }, { t: "16", c: false }] },
            { q: "(100)₈ in decimal is:", a: [{ t: "64", c: true }, { t: "100", c: false }, { t: "8", c: false }, { t: "72", c: false }] },
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let soundContext;
        let timerInterval;
        let timeLeft = 30;

        function playSound(freq = 400, type = 'sine') {
            if (!soundContext) soundContext = new (window.AudioContext || window.webkitAudioContext)();
            const osc = soundContext.createOscillator();
            const gain = soundContext.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, soundContext.currentTime);
            gain.gain.setValueAtTime(0.1, soundContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, soundContext.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(soundContext.destination);
            osc.start(); osc.stop(soundContext.currentTime + 0.1);
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function initQuiz() {
            shuffle(questions);
            questions.forEach(q => shuffle(q.a));
            currentQuestionIndex = 0;
            score = 0;
            showQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('time-left').innerText = timeLeft;
            document.getElementById('timer').classList.remove('warning');
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 10) {
                    document.getElementById('timer').classList.add('warning');
                    playSound(200, 'square');
                }
                if (timeLeft <= 0) handleAnswer(null, false);
            }, 1000);
        }

        function showQuestion() {
            startTimer();
            const q = questions[currentQuestionIndex];
            document.getElementById('questionText').innerText = q.q;
            document.getElementById('questionCount').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            q.a.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `<span>${opt.t}</span> <i class="fas fa-check"></i><i class="fas fa-xmark"></i>`;
                btn.onclick = () => handleAnswer(btn, opt.c);
                grid.appendChild(btn);
            });
            document.getElementById('progressBar').style.width = `${(currentQuestionIndex / questions.length) * 100}%`;
        }

        function handleAnswer(btn, isCorrect) {
            clearInterval(timerInterval);
            playSound(isCorrect ? 600 : 200, isCorrect ? 'triangle' : 'square');
            document.querySelectorAll('.option').forEach(o => o.style.pointerEvents = 'none');
            if (btn) {
                if (isCorrect) { btn.classList.add('correct'); score++; }
                else btn.classList.add('wrong');
            }
            if (!isCorrect) {
                document.querySelectorAll('.option').forEach((o, i) => {
                    if (questions[currentQuestionIndex].a[i].c) o.classList.add('correct');
                });
            }
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) showQuestion();
                else showResults();
            }, 1200);
        }

        function showResults() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('scoreValue').innerText = `${score}/${questions.length}`;
            document.getElementById('progressBar').style.width = '100%';
            
            const percentage = (score / questions.length) * 100;
            if (percentage >= 70) {
                document.getElementById('resultTitle').innerText = "System Mastery Achieved!";
                document.getElementById('feedbackText').innerText = "You have officially conquered the Number System.";
                document.getElementById('resultIcon').innerHTML = '<i class="fas fa-microchip trophy-icon" style="color: var(--aurora-teal);"></i>';
                document.getElementById('failurePanel').style.display = 'none';
                triggerConfetti();
            } else {
                document.getElementById('resultTitle').innerText = "Initialization Failed";
                document.getElementById('feedbackText').innerText = "";
                document.getElementById('resultIcon').innerHTML = '<i class="fas fa-circle-exclamation trophy-icon" style="color: #ff4444;"></i>';
                document.getElementById('failurePanel').style.display = 'block';
            }
        }

        function triggerConfetti() {
            const end = Date.now() + 3000;
            const colors = ['#00ffcc', '#00d4ff', '#9d00ff'];
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function restartQuiz() {
            playSound(440);
            document.getElementById('quizScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';
            initQuiz();
        }

        const themeBtn = document.getElementById('themeBtn');
        themeBtn.onclick = () => {
            playSound(500);
            const current = document.body.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', target);
            themeBtn.innerHTML = target === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('cyberTheme', target);
        };

        window.onload = () => {
            const saved = localStorage.getItem('cyberTheme') || 'dark';
            document.body.setAttribute('data-theme', saved);
            themeBtn.innerHTML = saved === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            initQuiz();
        };
    </script>
</body>
</html>
