<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Software Quiz - CYBER BREAKER</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            /* Light Mode */
            --bg-body: #f0f7ff;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --border-glass: rgba(255, 255, 255, 0.3);
            --shadow-glass: rgba(0, 102, 255, 0.1);
            --text-primary: #1a2b4b;
            --text-secondary: #4a5d7e;
            --accent-primary: #3b82f6;
            --accent-secondary: #a855f7;
            --correct: #10b981;
            --wrong: #ef4444;
        }

        body.dark-theme {
            /* Dark Mode */
            --bg-body: #050a15;
            --bg-glass: rgba(15, 23, 42, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
            --shadow-glass: rgba(0, 0, 0, 0.4);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-primary: #60a5fa;
            --accent-secondary: #c084fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px 0 var(--shadow-glass);
        }

        /* Navigation */
        nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--accent-primary);
            text-decoration: none;
        }

        .logo img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-primary);
        }

        .nav-actions {
            display: flex;
            gap: 15px;
        }

        .theme-toggle, .back-link {
            background: var(--bg-glass);
            color: var(--text-primary);
            border: 1px solid var(--border-glass);
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .theme-toggle:hover, .back-link:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
        }

        /* Quiz Container */
        .quiz-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 5%;
        }

        .quiz-card {
            width: 100%;
            max-width: 850px;
            padding: 40px;
            border-radius: 30px;
            position: relative;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timer-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-primary);
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 15px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .timer-badge.warning {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .q-count {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .question-text {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 25px 0;
            line-height: 1.3;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 16px;
        }

        .option-btn {
            background: var(--bg-glass);
            border: 2px solid var(--border-glass);
            padding: 22px 28px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            background: rgba(59, 130, 246, 0.08);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }

        .option-btn.correct {
            border-color: var(--correct) !important;
            background: rgba(16, 185, 129, 0.15) !important;
            color: var(--correct);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .option-btn.wrong {
            border-color: var(--wrong) !important;
            background: rgba(239, 68, 68, 0.15) !important;
            color: var(--wrong);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .next-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
            margin: 30px auto 0;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .next-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .score-circle {
            width: 220px;
            height: 220px;
            border: 12px solid var(--accent-primary);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            background: var(--bg-glass);
            box-shadow: 0 15px 45px var(--shadow-glass);
        }

        .score-num {
            font-size: 5.5rem;
            font-weight: 800;
            color: var(--accent-primary);
            line-height: 1;
        }

        .score-text {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .result-title {
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-btns {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn-main {
            padding: 18px 45px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: none;
        }

        .btn-retry {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
        }

        .btn-lesson {
            background: var(--bg-glass);
            color: var(--text-primary);
            border: 2px solid var(--border-glass);
        }

        .btn-main:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        /* Background Decorations */
        .bg-glow {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, var(--accent-primary), transparent 75%);
            opacity: 0.08;
            z-index: -1;
            border-radius: 50%;
            filter: blur(100px);
        }

        #glow-1 { top: -20%; left: -10%; }
        #glow-2 { bottom: -10%; right: -10%; }
    </style>
</head>

<body>

    <div class="bg-glow" id="glow-1"></div>
    <div class="bg-glow" id="glow-2"></div>

    <nav>
        <a href="index.html" class="logo">
            <img src="logo.jpeg" alt="CYBER BREAKER Logo">
            <span>CYBER BREAKER</span>
        </a>
        <div class="nav-actions">
            <button class="theme-toggle" id="theme-toggle">
                <i class="fas fa-moon"></i>
            </button>
            <a href="system software.html" class="back-link">
                <i class="fas fa-book-open"></i> Lesson
            </a>
        </div>
    </nav>

    <div class="quiz-container">
        <div class="quiz-card glass">
            
            <div id="quiz-area">
                <div class="quiz-header">
                    <h1>System Software Quiz</h1>
                    <div class="timer-badge" id="timer-display">
                        <i class="fas fa-clock"></i> <span id="time-left">30</span> Seconds
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div class="q-count" id="q-count">Question 1 of 20</div>
                </div>

                <div class="question-box">
                    <h2 class="question-text" id="question-text">Loading Challenge...</h2>
                    <div class="options-grid" id="options-grid">
                        <!-- Options filled by JS -->
                    </div>
                </div>

                <div style="text-align: center;">
                    <button class="next-btn" id="next-btn">Continue <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>

            <div class="result-screen" id="result-screen">
                <div id="result-icon-area" style="margin-bottom: 20px;"></div>
                <h2 class="result-title" id="result-title">Quiz Complete!</h2>
                <div class="score-circle">
                    <span class="score-num" id="final-score">0</span>
                    <span class="score-text">out of 20</span>
                </div>
                <p id="result-msg" style="font-size: 1.3rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto 30px; line-height: 1.5;">
                    Your results are in. Let's see how you did!
                </p>
                <div class="result-btns">
                    <button class="btn-main btn-retry" id="retry-btn">
                        <i class="fas fa-redo"></i> Try Again
                    </button>
                    <a href="system software.html" class="btn-main btn-lesson">
                        <i class="fas fa-book-open"></i> Back to Lesson
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        const QUESTIONS_DATA = [
            {"q": "What is system software?", "o": ["Software for games", "Software that manages computer hardware", "Software for drawing", "Software for music"], "c": 1},
            {"q": "What is the main function of system software?", "o": ["Play videos", "Manage hardware and run applications", "Create images", "Write documents"], "c": 1},
            {"q": "Which is an example of system software?", "o": ["Microsoft Word", "Microsoft Windows", "Adobe Photoshop", "Google Chrome"], "c": 1},
            {"q": "Which type of system software manages the entire computer?", "o": ["Device driver", "Utility program", "Operating system", "Application software"], "c": 2},
            {"q": "Which is a mobile operating system?", "o": ["Android", "Microsoft Word", "Adobe Illustrator", "PowerPoint"], "c": 0},
            {"q": "Which operating system is open source?", "o": ["Linux", "Microsoft Word", "Photoshop", "Excel"], "c": 0},
            {"q": "Which operating system is used on Apple computers?", "o": ["macOS", "Windows XP", "Linux Mint", "Ubuntu"], "c": 0},
            {"q": "What software starts first when a computer is turned on?", "o": ["Game", "Operating System", "Browser", "Music player"], "c": 1},
            {"q": "What does the operating system manage?", "o": ["Hardware and software", "Only games", "Only videos", "Only files"], "c": 0},
            {"q": "Which type of software helps hardware communicate with the computer?", "o": ["Utility software", "Device driver", "Game software", "Browser"], "c": 1},
            {"q": "A printer usually needs what to work with a computer?", "o": ["Browser", "Driver", "Game", "Antivirus"], "c": 1},
            {"q": "Utility software is mainly used to:", "o": ["Play games", "Maintain and improve system performance", "Write documents", "Watch movies"], "c": 1},
            {"q": "Which is an example of utility software?", "o": ["CCleaner", "Microsoft Word", "PowerPoint", "Photoshop"], "c": 0},
            {"q": "Antivirus software is used to:", "o": ["Play music", "Protect the computer from viruses", "Draw images", "Create presentations"], "c": 1},
            {"q": "What is a language translator?", "o": ["A program that converts programming language into machine language", "A drawing tool", "A video editor", "A browser"], "c": 0},
            {"q": "Which translates an entire program at once?", "o": ["Interpreter", "Compiler", "Driver", "Utility"], "c": 1},
            {"q": "Which translates code line by line?", "o": ["Interpreter", "Compiler", "Antivirus", "Driver"], "c": 0},
            {"q": "Which converts assembly language into machine code?", "o": ["Interpreter", "Assembler", "Compiler", "Browser"], "c": 1},
            {"q": "Which is a compiler example?", "o": ["GCC", "Photoshop", "Chrome", "Word"], "c": 0},
            {"q": "What happens if system software is missing?", "o": ["Computer cannot run properly", "Computer becomes faster", "Computer plays games better", "Nothing happens"], "c": 0}
        ];

        let currentQIndex = 0;
        let userScore = 0;
        let timerVal = 30;
        let quizTimer;
        let quizQuestions = [];
        let audioCtx;

        // Fisher-Yates Shuffle
        function betterShuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function playSound(freq = 400, type = 'sine', duration = 0.1) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function initQuiz() {
            playSound(600, 'sine', 0.1);
            quizQuestions = betterShuffle([...QUESTIONS_DATA]);
            currentQIndex = 0;
            userScore = 0;
            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            displayQuestion();
        }

        function displayQuestion() {
            const qData = quizQuestions[currentQIndex];
            const qTitle = document.getElementById('question-text');
            const qCount = document.getElementById('q-count');
            const pBar = document.getElementById('progress-bar');
            const grid = document.getElementById('options-grid');
            const nextBtn = document.getElementById('next-btn');

            qTitle.innerText = qData.q;
            qCount.innerText = `Question ${currentQIndex + 1} of 20`;
            pBar.style.width = `${((currentQIndex + 1) / 20) * 100}%`;
            nextBtn.style.display = 'none';
            grid.innerHTML = '';

            // Mapping options for robust shuffling
            const options = qData.o.map((txt, idx) => ({ text: txt, isCorrect: idx === qData.c }));
            betterShuffle(options).forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${String.fromCharCode(65 + i)}.</span> ${opt.text}`;
                btn.onclick = () => {
                    playSound(450, 'sine', 0.05);
                    processAnswer(opt.isCorrect, btn);
                };
                grid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(quizTimer);
            timerVal = 30;
            updateTimerUI();
            quizTimer = setInterval(() => {
                timerVal--;
                updateTimerUI();
                if (timerVal <= 0) {
                    clearInterval(quizTimer);
                    revealCorrectAnswer();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const display = document.getElementById('time-left');
            const badge = document.getElementById('timer-display');
            display.innerText = timerVal;
            if (timerVal <= 10) badge.classList.add('warning');
            else badge.classList.remove('warning');
        }

        function processAnswer(isCorrect, selectedBtn) {
            clearInterval(quizTimer);
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                userScore++;
                playSound(800, 'sine', 0.1);
            } else {
                selectedBtn.classList.add('wrong');
                revealCorrectAnswer();
                playSound(200, 'square', 0.2);
            }
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function revealCorrectAnswer() {
            clearInterval(quizTimer);
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(btn => {
                btn.disabled = true;
                // Since options was mapped with isCorrect, we check the text or use the original data
                const qData = quizQuestions[currentQIndex];
                const correctText = qData.o[qData.c];
                if (btn.innerText.includes(correctText)) {
                    btn.classList.add('correct');
                }
            });
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        document.getElementById('next-btn').onclick = () => {
            playSound(500, 'sine', 0.08);
            currentQIndex++;
            if (currentQIndex < 20) displayQuestion();
            else finishQuiz();
        };

        function finishQuiz() {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = userScore;
            
            const perc = (userScore / 20) * 100;
            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-msg');
            const icon = document.getElementById('result-icon-area');
            const retry = document.getElementById('retry-btn');
            
            if (perc >= 70) {
                playSound(1000, 'triangle', 0.6);
                title.innerText = "Fantastic Work!";
                msg.innerText = "You've mastered the basics of System Software. Incredible job!";
                icon.innerHTML = '<i class="fas fa-trophy" style="font-size: 6rem; color: #fbbf24;"></i>';
                retry.innerText = "Redo Quiz";
                confetti({
                    particleCount: 200,
                    spread: 100,
                    origin: { y: 0.6 },
                    colors: ['#3b82f6', '#a855f7', '#10b981']
                });
            } else {
                playSound(150, 'sawtooth', 0.4);
                title.innerText = "Almost There!";
                msg.innerText = "You need at least 70% to pass. Review the lesson and try again!";
                icon.innerHTML = '<i class="fas fa-heart-crack" style="font-size: 6rem; color: #ef4444;"></i>';
                retry.innerText = "Try Again";
            }
        }

        document.getElementById('retry-btn').onclick = initQuiz;

        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = themeBtn.querySelector('i');
        
        themeBtn.onclick = () => {
            playSound(550, 'sine', 0.08);
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            themeIcon.className = 'fas fa-sun';
        }

        initQuiz();
    </script>
</body>
</html>
