<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Visualizer | Cyber Breaker Labs</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #020617;
            --node: #1e293b;
            --accent: #38bdf8;
            --packet: #4ade80;
            --error: #f43f5e;
            --text: #f8fafc;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        nav {
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .back-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        /* Network Canvas */
        .workspace {
            flex: 1;
            position: relative;
            background-image: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            overflow: hidden;
        }

        .grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* Nodes */
        .node {
            position: absolute;
            width: 100px;
            height: 100px;
            background: var(--node);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 10;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .node i { font-size: 2rem; color: var(--accent); }
        .node span { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }

        .node.active { border-color: var(--accent); box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }

        #node-user { top: 50%; left: 10%; transform: translateY(-50%); }
        #node-router { top: 50%; left: 45%; transform: translateY(-50%); }
        #node-server { top: 50%; left: 80%; transform: translateY(-50%); }

        /* Cables / Paths */
        .cable {
            position: absolute;
            height: 4px;
            background: var(--glass-border);
            z-index: 1;
            transform-origin: left center;
        }

        #cable-1 { width: 35%; top: 50%; left: calc(10% + 100px); }
        #cable-2 { width: 35%; top: 50%; left: calc(45% + 100px); }

        /* Packets */
        .packet {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--packet);
            border-radius: 50%;
            z-index: 20;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 15px var(--packet);
            display: none;
            display: flex;
            align-items: center; justify-content: center;
            font-size: 0.6rem; color: #000; font-weight: 900;
        }

        /* Controls */
        .control-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 24px;
            display: flex;
            gap: 2rem;
            align-items: center;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron';
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .stat-group {
            display: flex;
            gap: 1.5rem;
            border-left: 1px solid var(--glass-border);
            padding-left: 1.5rem;
        }

        .stat { display: flex; flex-direction: column; gap: 2px; }
        .stat label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: 800; }
        .stat span { font-family: 'Orbitron'; font-size: 1.2rem; color: var(--accent); }

        /* HUD Info */
        .hud {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .hud h1 { font-family: 'Orbitron'; font-size: 2rem; margin-bottom: 10px; }
        .hud p { color: #94a3b8; font-size: 0.9rem; }

    </style>
</head>
<body>

    <nav>
        <div style="font-family: 'Orbitron'; font-weight: 800; font-size: 1.2rem; color: var(--accent)">
            CYBER-LINK VISUALIZER
        </div>
        <a href="../Labs.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Hub
        </a>
    </nav>

    <div class="workspace">
        <div class="grid-overlay"></div>

        <div class="hud">
            <h1>Network Virtualizer</h1>
            <p>Observe how data packets are routed from a User to a Server via IP addressing.</p>
        </div>

        <!-- Cable Lines -->
        <div class="cable" id="cable-1"></div>
        <div class="cable" id="cable-2"></div>

        <!-- Devices -->
        <div class="node" id="node-user">
            <i class="fas fa-laptop"></i>
            <span>User Hub</span>
        </div>

        <div class="node" id="node-router">
            <i class="fas fa-network-wired"></i>
            <span>IP Router</span>
        </div>

        <div class="node" id="node-server">
            <i class="fas fa-server"></i>
            <span>Remote SVR</span>
        </div>

        <!-- Packet -->
        <div class="packet" id="packet">1</div>
    </div>

    <!-- Controls -->
    <div class="control-panel">
        <button class="btn" onclick="sendPacket()" id="send-btn">
            Send Packet <i class="fas fa-paper-plane"></i>
        </button>

        <div class="stat-group">
            <div class="stat">
                <label>Packets Sent</label>
                <span id="sent-count">0</span>
            </div>
            <div class="stat">
                <label>Latency</label>
                <span id="latency">0ms</span>
            </div>
            <div class="stat">
                <label>Status</label>
                <span id="status-text" style="font-size: 0.8rem; color: var(--packet)">READY</span>
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <button class="btn" style="background: var(--error);" onclick="toggleObstacle()" id="error-btn">Inject Noise</button>
        </div>
    </div>

    <script>
        let sent = 0;
        let isSending = false;
        let noiseInject = false;

        async function sendPacket() {
            if(isSending) return;
            isSending = true;
            sent++;
            document.getElementById('sent-count').innerText = sent;
            document.getElementById('send-btn').disabled = true;

            const packet = document.getElementById('packet');
            const status = document.getElementById('status-text');
            const latency = document.getElementById('latency');

            packet.innerText = Math.floor(Math.random() * 999);
            packet.style.display = 'flex';
            packet.style.background = 'var(--packet)';
            packet.style.boxShadow = '0 0 15px var(--packet)';

            status.innerText = "ROUTING...";
            status.style.color = "var(--accent)";

            // Step 1: User -> Router
            document.getElementById('node-user').classList.add('active');
            await animatePacket(10, 45, 1000);
            document.getElementById('node-user').classList.remove('active');
            document.getElementById('node-router').classList.add('active');

            // Optional Noise Delay
            if(noiseInject) {
                status.innerText = "DNS RETRY...";
                status.style.color = "var(--error)";
                packet.style.background = "var(--error)";
                await wait(1500);
            }

            // Step 2: Router -> Server
            await animatePacket(45, 80, 1000);
            document.getElementById('node-router').classList.remove('active');
            document.getElementById('node-server').classList.add('active');
            
            // Finalize
            status.innerText = "DELIVERED";
            status.style.color = "var(--packet)";
            latency.innerText = (noiseInject ? 2500 : 200) + "ms";
            
            await wait(500);
            document.getElementById('node-server').classList.remove('active');
            packet.style.display = 'none';
            document.getElementById('send-btn').disabled = false;
            isSending = false;
        }

        function animatePacket(fromPerc, toPerc, duration) {
            return new Promise(resolve => {
                const packet = document.getElementById('packet');
                const start = Date.now();
                
                function frame() {
                    let now = Date.now();
                    let t = (now - start) / duration;
                    if (t > 1) t = 1;
                    
                    let currentPos = fromPerc + (toPerc - fromPerc) * t;
                    packet.style.left = `calc(${currentPos}% + 40px)`;
                    
                    if (t < 1) requestAnimationFrame(frame);
                    else resolve();
                }
                requestAnimationFrame(frame);
            });
        }

        function toggleObstacle() {
            noiseInject = !noiseInject;
            const btn = document.getElementById('error-btn');
            btn.innerText = noiseInject ? "Noise Active" : "Inject Noise";
            btn.style.opacity = noiseInject ? "1" : "0.5";
        }

        function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
    </script>
</body>
</html>
